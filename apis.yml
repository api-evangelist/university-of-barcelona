aid: university-of-barcelona
name: University of Barcelona
x-type: university
x-category: Public Research University
description: >-
  The University of Barcelona (Universitat de Barcelona, UB) is a public
  research university founded in 1450 in Barcelona, Catalonia, Spain, ranked
  #165 in the QS World University Rankings 2025. UB operates no central
  developer portal, no public API program and no confirmed organization-wide
  GitHub account, and its main web estate at www.ub.edu sits behind a
  Cloudflare bot challenge that returns HTTP 403 to any automated client. What
  it does operate is a genuine, machine-readable institutional footprint that
  is easy to miss because none of it is marketed as an API: a SAML 2.0 identity
  provider published through RedIRIS SIR into eduGAIN with the ub.edu attribute
  scope; an LTI 1.3 Advantage tool platform on its self-hosted Moodle at
  campusvirtual.ub.edu, with a live JWKS and token endpoint; an OAI-PMH 2.0
  data provider over 100 journal sets at revistes.ub.edu; a DSpace 7.6.6
  repository at diposit.ub.edu that was live in June 2026 and returned 503
  across every probe on 2026-09-01; and a Crossref membership for the
  university press. Its research-data repository and library discovery layer
  are tenancies on consortium and vendor platforms operated by CSUC and Ex
  Libris, not UB engineering, and are recorded here as relationships rather
  than as UB contracts.
