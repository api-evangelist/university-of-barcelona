x-coverage:
  state: covered
  reason: covered
  detail: >-
    Real institution-operated machine-readable surfaces were read directly, not
    inferred: the UB SAML 2.0 IdP metadata document in RedIRIS SIR / eduGAIN
    (200, text/xml, shibmd:Scope ub.edu), the Moodle LTI 1.3 JWKS and Advantage
    token endpoint at campusvirtual.ub.edu (200 / 400-live), and the OAI-PMH 2.0
    data provider at revistes.ub.edu answering Identify, ListSets (100 sets) and
    ListMetadataFormats. Three limits qualify the picture and none of them is a
    reason to call the profile thin. First, the central web estate — www.ub.edu,
    web.ub.edu and the transparency open-data pages — sits behind a Cloudflare
    bot challenge returning HTTP 403 with cf-mitigated: challenge to a full
    browser User-Agent, so the open-data portal could not be read and no
    OpenData pointer is claimed. Second, the whole diposit.ub.edu host, which
    carries UB's DSpace 7.6.6 REST API and its OAI-PMH endpoint, returned an
    Apache 503 maintenance page on every probe across the run; both surfaces are
    retained and marked degraded rather than deleted, because a 503 is an outage
    and not a retirement. Third, UB publishes no OpenAPI, AsyncAPI or other
    machine-readable contract anywhere, so no spec is saved and none was
    generated. The research-data repository (CSUC Dataverse) and library
    discovery (Ex Libris Primo VE) are tenancies recorded as relationships, and
    the Crossref and ROR entries are registry memberships — none of their
    contracts is credited to UB.
