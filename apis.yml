  - aid: university-of-barcelona:campusvirtual-moodle
    name: Campus Virtual UB (Moodle) — LTI 1.3 Advantage platform and Web Services
    x-operator: institution
    description: >-
      UB's self-hosted Moodle learning platform on the university's own host.
      It acts as an LTI 1.3 tool platform: the JWKS at /mod/lti/certs.php serves
      a live RS256 public key set and the LTI Advantage token endpoint at
      /mod/lti/token.php answers an empty request with a well-formed OAuth2
      invalid_request error, confirming the service is enabled. The Moodle Web
      Services REST endpoint is also enabled and token-gated, returning an
      invalidtoken exception rather than a disabled-service error. Both are real
      institution-operated APIs; both require credentials issued by UB, so
      neither is openly consumable. Confirmed live 2026-09-01.
