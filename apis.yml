aid: university-of-barcelona
name: University of Barcelona
description: >-
  The University of Barcelona (Universitat de Barcelona, UB) is a public
  research university founded in 1450 and based in Barcelona, Catalonia, Spain.
  It is ranked #165 in the QS World University Rankings 2025. Its publicly
  documented developer/API footprint is limited and primarily centered on
  library and scholarly infrastructure: the Dipòsit Digital de la Universitat de
  Barcelona runs DSpace 7.6.6, exposing a public REST API and an OAI-PMH
  metadata-harvesting endpoint. The university also operates centralized
  single sign-on (SSO) supporting SAML 2.0 / CAS, and publishes institutional
  open data through its transparency portal. No central, branded public
  developer portal or official organization-wide GitHub account was confirmed.
