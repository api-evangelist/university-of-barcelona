  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline, which settles WHO OPERATES each
      surface before saving anything. UB still has no developer portal, no
      public API program, no OpenAPI or AsyncAPI anywhere, and no confirmed
      organization-wide GitHub account — and its central web estate now sits
      behind a Cloudflare bot challenge that returns 403 to a full browser
      User-Agent, so the transparency open-data pages could not be read. What
      the June review missed is that UB operates three real, machine-readable,
      institution-run surfaces that are simply not marketed as APIs. Its SAML
      2.0 identity provider is published as signed metadata through RedIRIS SIR
      into eduGAIN (entityID https://www.rediris.es/sir/ubidp, shibmd:Scope
      ub.edu) — the strongest surface it has. Its self-hosted Moodle at
      campusvirtual.ub.edu is a live LTI 1.3 Advantage tool platform with a
      working JWKS and token endpoint, plus an enabled token-gated Web Services
      REST API. Its OJS journal platform at revistes.ub.edu answers OAI-PMH 2.0
      over 100 sets. The university press is a Crossref member (17854, prefixes
      10.1344 / 10.32869, 10,561 DOIs). Against the Kin Score `education`
      regime that is five of twelve domain standards evidenced by live probe:
      lti, saml, shibboleth, oai-pmh, crossref. Two corrections in the other
      direction: the whole diposit.ub.edu host — DSpace REST and OAI-PMH, both
      HTTP 200 in June — returned 503 on every probe and is now marked degraded;
      and the research-data repository and library discovery layer, previously
      unlabelled, are tenancies on CSUC's Dataverse and Ex Libris' Primo VE and
      are recorded as relationships, not as UB contracts. No spec was generated.
      Nothing was fabricated.
